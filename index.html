<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>B-Novative | Sertifika Doğrulama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#030712;--panel:#0b1327;--line:#1b2a4a;--text:#e6edf7;--muted:#94a3b8;--blue:#23BEF5;--orange:#D97706;--ok:#34d399;--bad:#f87171}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:radial-gradient(ellipse at 50% 0%,#0a1a3a 0%,var(--bg) 60%);color:var(--text);font-family:Roboto,Arial,sans-serif;display:flex;justify-content:center;padding:40px 16px}
  main{width:100%;max-width:560px}
  .brand{text-align:center;margin-bottom:28px}
  .brand h1{margin:0;font-size:26px;letter-spacing:.5px}
  .brand p{margin:6px 0 0;color:var(--blue);font-size:12px;letter-spacing:3px;font-weight:700}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
  label{display:block;font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:700;margin-bottom:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  input{flex:1;min-width:200px;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:#050b1a;color:var(--text);font:inherit;letter-spacing:.5px}
  input:focus{outline:2px solid var(--blue);border-color:transparent}
  button{padding:12px 20px;border:0;border-radius:8px;background:var(--blue);color:#021018;font:inherit;font-weight:700;cursor:pointer}
  button:hover{filter:brightness(1.1)}
  #result{margin-top:20px}
  .res{border-radius:12px;padding:20px;border:1px solid}
  .res.ok{border-color:var(--ok);background:rgba(52,211,153,.07)}
  .res.bad{border-color:var(--bad);background:rgba(248,113,113,.07)}
  .status{font-weight:700;font-size:15px;margin-bottom:12px}
  .ok .status{color:var(--ok)} .bad .status{color:var(--bad)}
  .name{font-family:Georgia,serif;font-weight:700;font-size:26px;margin:4px 0 16px}
  dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
  dt{color:var(--muted);font-size:12px;letter-spacing:1.5px;font-weight:700;align-self:center}
  dd{margin:0;font-weight:500;word-break:break-all}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
</style>
</head>
<body>
<main>
  <div class="brand">
    <h1>B-Novative</h1>
    <p>CERTIFICATE VERIFICATION</p>
  </div>
  <div class="card">
    <label for="cid">SERTİFİKA NUMARASI</label>
    <div class="row">
      <input id="cid" type="text" placeholder="BNV-UNI101-2026-089" autocomplete="off" spellcheck="false">
      <button id="btn" type="button">Doğrula</button>
    </div>
    <div id="result" aria-live="polite"></div>
  </div>
  <footer>Sertifika üzerindeki "Certificate ID" alanındaki numarayı girin.<br><span style="opacity:.5">sürüm 2 · yerleşik veri</span></footer>
</main>

<script>
(function () {
  var input = document.getElementById('cid');
  var out = document.getElementById('result');
  // ===== SERTİFİKA VERİLERİ: yeni kayıtları buraya ekleyin =====
  var data = {
    issuer: "B-Novative",
    certificates: [
      { id: "BNV-UNI101-2026-089", name: "MELTEM AKYOL", project: "Uni101 App", duration: "14 Days", issued: "October 5, 2026" }
    ]
  };
  // ===============================================================

  function norm(s) { return String(s || '').trim().toUpperCase().replace(/\s+/g, ''); }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function show(cert) {
    out.textContent = '';
    var box = el('div', 'res ' + (cert ? 'ok' : 'bad'));
    if (!cert) {
      box.appendChild(el('div', 'status', '✕ Kayıt bulunamadı'));
      box.appendChild(el('div', '', 'Bu numarayla eşleşen bir sertifika bulunamadı. Numarayı kontrol edip tekrar deneyin.'));
    } else {
      box.appendChild(el('div', 'status', '✓ Sertifika geçerli'));
      box.appendChild(el('div', 'name', cert.name));
      var dl = el('dl');
      [['ORGANIZATION', data.issuer], ['PROJECT', cert.project], ['DURATION', cert.duration],
       ['DATE OF ISSUE', cert.issued], ['CERTIFICATE ID', cert.id]].forEach(function (r) {
        dl.appendChild(el('dt', '', r[0]));
        dl.appendChild(el('dd', '', r[1]));
      });
      box.appendChild(dl);
    }
    out.appendChild(box);
  }

  function verify() {
    var id = norm(input.value);
    if (!id) { out.textContent = ''; return; }
    var found = data.certificates.filter(function (c) { return norm(c.id) === id; })[0];
    show(found || null);
  }

  document.getElementById('btn').addEventListener('click', verify);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') verify(); });

  var q = new URLSearchParams(location.search).get('id');
  if (q) { input.value = q; verify(); }
})();
</script>
</body>
</html>
